name: Apple verifier checks
on:
  push:
    branches: [mobile/ios-preparation]
    paths: ['services/apple-verifier/**', 'worker/**', 'tests/**', '.github/workflows/apple-verifier.yml']
  pull_request:
    paths: ['services/apple-verifier/**', 'worker/**', 'tests/**', '.github/workflows/apple-verifier.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/apple-verifier/package-lock.json
      - run: npm ci
        working-directory: services/apple-verifier
      - run: node --test tests/*.test.mjs
      - run: npm test
        working-directory: services/apple-verifier
