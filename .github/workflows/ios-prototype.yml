name: iOS prototype compile
on:
  push:
    branches: [release/apple-production-preparation]
    paths: ['.github/workflows/ios-prototype.yml']
  pull_request:
    paths:
      - 'mobile/**'
      - 'scripts/build-mobile.mjs'
      - 'scripts/install-storekit.mjs'
      - '.github/workflows/ios-prototype.yml'
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'js/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    if: >-
      github.event_name != 'push' || github.event.head_commit.message == 'release: capture iPad screenshots 34.1'
    env:
      CR_MOBILE_PROFILE: production
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm run build:web
        working-directory: mobile
      - run: npx cap add ios
        working-directory: mobile
      - run: node scripts/install-storekit.mjs
      - name: Compile unsigned simulator app
        run: >-
          xcodebuild -project mobile/ios/App/App.xcodeproj
          -scheme App -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/calcio-ios"
          CODE_SIGNING_ALLOWED=NO build

      - name: Capture actual iPad simulator screen
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          DEVICE=$(python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/devices.json")); a=[v for vs in d["devices"].values() for v in vs if "iPad Pro 13-inch" in v["name"] and v.get("isAvailable")]; assert a,"13-inch iPad simulator unavailable"; print(a[0]["udid"])')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/calcio-ios/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$DEVICE" com.calcioreport.app -AppleLanguages '(it)' -AppleLocale it_IT
          sleep 15
          mkdir -p "$RUNNER_TEMP/ipad-screenshots"
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/ipad-screenshots/calcio-report-ipad-13.png"
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/ipad-screenshots/calcio-report-ipad-13.png"
      - uses: actions/upload-artifact@v4
        with:
          name: calcio-report-ipad-13-screenshots
          path: ${{ runner.temp }}/ipad-screenshots/
          if-no-files-found: error
          retention-days: 7
