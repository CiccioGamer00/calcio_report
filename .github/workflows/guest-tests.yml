name: Guest analysis checks
on:
  push:
    branches: [feature/onboarding-conversion]
    paths:
      - 'worker/**'
      - 'tests/**'
      - '.github/workflows/guest-tests.yml'
      - 'js/**'
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'config.js'
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated guest tests (SQLite, fake relay)
        run: node --test tests/guest-analysis.test.mjs
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Targeted syntax, assets, matchday, prediction, admin regressions
        run: node --test tests/frontend-syntax.test.mjs tests/release-assets.test.mjs tests/matchday-feature.test.mjs tests/prediction-v3-worker-route.test.mjs tests/admin-access.test.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local browser test dependency
        run: python -m pip install websockets==15.0.1
      - name: Guest browser scenarios with fake relay
        run: python tests/guest-browser.py
