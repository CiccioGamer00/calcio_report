name: App Store metadata audit
on:
  push:
    branches: [release/apple-production-preparation]
    paths: ['scripts/app-store-metadata.mjs', '.github/workflows/app-store-metadata.yml']
permissions:
  contents: read
concurrency:
  group: app-store-metadata
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      github.repository == 'CiccioGamer00/calcio_report' && github.event.head_commit.message == 'release: audit App Store metadata 33.1' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Read sanitized release metadata (no mutations)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: node scripts/app-store-metadata.mjs
