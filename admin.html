<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Admin Calcio Report</title>
    <style>
      :root { color-scheme: dark; --bg:#0b121e; --panel:#142032; --border:#36475b; --muted:#acbbca; --green:#69e5ac; }
      * { box-sizing:border-box; }
      body { margin:auto; max-width:1120px; padding:clamp(16px,4vw,48px); font:16px/1.45 system-ui,sans-serif; color:#edf3fa; background:var(--bg); }
      h1 { font-size:clamp(26px,4vw,38px); margin:0 0 18px; letter-spacing:-.035em; }
      h2 { font-size:22px; margin:24px 0 10px; }
      button,input,select,textarea { font:inherit; color:inherit; border:1px solid var(--border); border-radius:8px; padding:9px 12px; max-width:100%; }
      input,select,textarea { background:#0c1725; min-width:0; }
      button { background:#22334a; cursor:pointer; min-height:44px; }
      button:hover { background:#304560; }
      button:disabled { opacity:.55; }
      :focus-visible { outline:2px solid var(--green); outline-offset:2px; }
      .primary { background:var(--green); color:#10221d; border-color:transparent; font-weight:650; }
      .primary:hover { background:#92efc4; }
      .muted,.k,.meta { color:var(--muted); font-size:.88rem; }
      .toolbar,.rowbtn { display:flex; gap:8px; flex-wrap:wrap; align-items:end; }
      .toolbar label,.rowbtn label { display:grid; gap:4px; }
      #adminKey,#searchEmail,#reenableEmail { width: min(100%,22rem); }
      summary { cursor:pointer; }
      .recovery { margin:12px 0; }
      .recovery summary,.secondary summary { padding:10px 0; color:var(--muted); }
      #dashboard { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(145px,100%),1fr)); gap:8px; margin:18px 0; }
      .dashcard,.account { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 16px; min-width:0; overflow-wrap:anywhere; }
      .v { font-size:1.35rem; font-weight:650; }
      #output { margin-top:12px; }
      .account { margin-bottom:8px; }
      .account > summary { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(10rem,auto) auto; gap:14px; align-items:center; min-height:44px; list-style:none; }
      .account > summary::-webkit-details-marker { display:none; }
      .manage { color:var(--green); }
      .manage::after { content:" ▾"; }
      .account[open] .manage::after { content:" ▴"; }
      .badge { border-radius:5px; padding:3px 8px; font-size:.8rem; font-weight:700; }
      .pro { background:#194335; color:#91ebbb; }
      .trial { background:#42351f; color:#ffda8e; }
      .expired { background:#3a2934; color:#ffc1ce; }
      .detail { border-top:1px solid var(--border); margin-top:10px; padding-top:16px; }
      [data-pro-days] { width:7rem; }
      .secondary { margin-top:8px; }
      textarea { display:block; width:min(100%,34rem); margin:4px 0 8px; resize:vertical; }
      .danger,[data-act=disable] { color:#ffb1b1; }
      pre { white-space:pre-wrap; overflow-wrap:anywhere; }
      @media (max-width:650px) {
        .account > summary { grid-template-columns:minmax(0,1fr) auto; gap:6px 12px; }
        .manage { justify-self:end; }
        .toolbar label { width:100%; }
      }
    </style>
  </head>

  <body>
    <h1>Gestione utenti</h1>
    <input id="workerUrl" type="hidden" value="https://api.calcioreport.com">
    <div class="toolbar">
      <label>Chiave amministratore<input id="adminKey" type="password" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
      <button id="btnLoad" class="primary">Carica utenti</button>
      <button id="btnLock">Esci e cancella chiave</button>
    </div>
    <details class="recovery">
      <summary>Riabilita un utente bloccato</summary>
      <div class="toolbar">
        <label>Email dell’account<input id="reenableEmail" type="email" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
        <button id="btnReenable">Riabilita accesso</button>
      </div>
    </details>
    <div id="dashboard"></div>
    <h2>Elenco utenti</h2>
    <div class="toolbar">
      <input id="searchEmail" placeholder="Cerca per email" aria-label="Cerca per email">
      <select id="filterStatus" aria-label="Filtra per stato">
        <option value="">Tutti gli stati</option><option>PRO</option><option>TRIAL</option><option>SCADUTO</option>
      </select>
      <span id="miniStatus" class="muted"></span>
    </div>
    <datalist id="proDaysOptions"><option value="7"></option><option value="30"></option></datalist>
    <div id="output" style="margin-top: 12px"></div>

    <script>
            let __USERS__ = [];
            function escapeHtml(value) {
              return String(value ?? "").replace(/[&<>"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
              })[c]);
            }
            function fmtDate(ts) {
              const n = Number(ts || 0);
              if (!n) return "—";
              return new Date(n).toLocaleString("it-IT");
            }

            // stesso principio usato nell'app: evita 8gg appena creato
            function daysLeft(ts) {
              const diff = Number(ts || 0) - Date.now();
              if (diff <= 0) return 0;
              return Math.max(1, Math.floor(diff / (1000 * 60 * 60 * 24)));
            }

            function statusClass(s) {
              if (s === "PRO") return "pro";
              if (s === "TRIAL") return "trial";
              return "expired";
            }

            function getCfg() {
              return {
                url: "https://api.calcioreport.com",
                key: document.getElementById("adminKey").value.trim(),
                out: document.getElementById("output"),
                mini: document.getElementById("miniStatus"),
              };
            }

           
      async function loadUsers() {
        const { url, key, out, mini } = getCfg();
        __USERS__ = [];
        document.getElementById("dashboard").innerHTML = "";
        if (!key) { out.textContent = "Inserisci la chiave amministratore."; return; }
        out.innerHTML = "Caricamento...";
        mini.textContent = "";

        let res, text, data;
        try {
          res = await fetch(url + "/admin/users", {
            method: "GET",
            headers: { "x-admin-key": key },
          });
          text = await res.text();
          try { data = JSON.parse(text); } catch { data = null; }
        } catch (e) {
          out.textContent = "Errore rete: " + String(e.message || e);
          return;
        }

        if (!res.ok || !data || !data.ok) {
          out.innerHTML =
            "Errore Worker (status " + res.status + "):<br><pre>" +
            escapeHtml(text || "") +
            "</pre>";
          return;
        }

        __USERS__ = Array.isArray(data.users) ? data.users : [];
        renderUsers(__USERS__);
        await loadStats();
      }

      async function loadStats(){
        const { url, key } = getCfg();
        const dash = document.getElementById("dashboard");
        if (!dash) return;
        dash.innerHTML = '<div class="dashcard"><div class="k">Dashboard</div><div class="v">...</div></div>';
        let res, text, data;
        try {
          res = await fetch(url + "/admin/stats", { method: "GET", headers: { "x-admin-key": key } });
          text = await res.text();
          try { data = JSON.parse(text); } catch { data = null; }
        } catch(e){
          dash.innerHTML = '<div class="dashcard"><div class="k">Dashboard</div><div class="v danger">Errore rete</div></div>';
          return;
        }
        if (!res.ok || !data || !data.ok){
          dash.innerHTML = '<div class="dashcard"><div class="k">Dashboard</div><div class="v danger">Errore</div><div class="k" style="margin-top:6px">'+escapeHtml(text||'')+'</div></div>';
          return;
        }
        renderDashboard(data);
      }

      function renderDashboard(s){
        const dash = document.getElementById("dashboard");
        if (!dash) return;
        const fmtN = (n)=> (Number(n)||0).toString();
        dash.innerHTML = `
          <div class="dashcard"><div class="k">Online (ultimi 5m)</div><div class="v">${fmtN(s.online5m)}</div></div>
          <div class="dashcard"><div class="k">Attivi (24h)</div><div class="v">${fmtN(s.active24h)}</div></div>
          <div class="dashcard"><div class="k">Attivi (7d)</div><div class="v">${fmtN(s.active7d)}</div></div>
          <div class="dashcard"><div class="k">Nuovi PRO (24h)</div><div class="v">${fmtN(s.newPro24h)}</div></div>
          <div class="dashcard"><div class="k">Community · interessati</div><div class="v">${Number.isSafeInteger(s.communityInterested) && s.communityInterested >= 0 ? fmtN(s.communityInterested) : "Non disponibile"}</div><div class="k">Account unici, esclusi disabilitati e cancellati</div></div>
          <div class="dashcard" style="display:grid; align-content:center; gap:6px;">
            <button id="btnRefreshDash">Aggiorna dashboard</button>
            <span class="muted">${new Date(s.now).toLocaleString()}</span>
          </div>
        `;
        const b = document.getElementById("btnRefreshDash");
        if (b) b.onclick = ()=>loadStats();
      }
            function renderUsers(list) {
              const out = document.getElementById("output");
              const mini = document.getElementById("miniStatus");

              const q = (document.getElementById("searchEmail")?.value || "")
                .trim()
                .toLowerCase();
              const s = (document.getElementById("filterStatus")?.value || "").trim();

              let users = Array.isArray(list) ? list.slice() : [];

              if (q)
                users = users.filter((u) =>
                  String(u.email || "")
                    .toLowerCase()
                    .includes(q),
                );
              if (s) users = users.filter((u) => String(u.status || "") === s);

              mini.textContent = `Totale utenti: ${users.length}`;

              if (!users.length) {
                out.innerHTML = "<em>Nessun utente trovato con questi filtri.</em>";
                return;
              }

              out.innerHTML = users.map((u) => {
                const email = escapeHtml(u.email);
                const expiry = u.status === "PRO" ? u.paidUntil : u.status === "TRIAL" ? u.trialEndsAt : Math.max(u.trialEndsAt || 0, u.paidUntil || 0);
                return `
                  <details class="account">
                    <summary>
                      <strong>${email}</strong>
                      <span class="badge ${statusClass(u.status)}">${escapeHtml(u.status || "SCADUTO")}</span>
                      <span class="meta">Scadenza · ${fmtDate(expiry)}</span>
                      <span class="manage">Gestisci</span>
                    </summary>
                    <div class="detail">
                      <div class="rowbtn">
                        <label>Giorni PRO da aggiungere
                          <input data-pro-days type="number" inputmode="numeric" min="1" max="365" step="1" required value="30" list="proDaysOptions">
                        </label>
                        <button class="primary" data-act="addDays" data-email="${email}">Aggiungi giorni PRO</button>
                      </div>
                      <details class="secondary">
                        <summary>Dettagli e note</summary>
                        <p>Trial · ${daysLeft(u.trialEndsAt)} giorni · Fine ${fmtDate(u.trialEndsAt)}<br>
                           PRO · ${daysLeft(u.paidUntil)} giorni · Fine ${fmtDate(u.paidUntil)}<br>
                           Registrato · ${fmtDate(u.createdAt)}<br>Ultima attività · ${fmtDate(u.lastSeenAt)}</p>
                        <label>Nota interna<textarea data-note-email="${email}">${escapeHtml(u.note)}</textarea></label>
                        <button data-act="saveNote" data-email="${email}">Salva nota</button>
                      </details>
                      <details class="secondary">
                        <summary>Altre operazioni</summary>
                        <div class="rowbtn">
                          <button data-act="mint" data-email="${email}">Genera codice</button>
                          <button data-act="adjust" data-delta="-30" data-email="${email}">Sottrai 30 giorni PRO</button>
                          <button data-act="resolveAdjust" data-email="${email}">Sblocca rettifica verificata</button>
                          <button data-act="disable" data-email="${email}">Disabilita accesso</button>
                        </div>
                      </details>
                    </div>
                  </details>`;
              }).join("");

              out.querySelectorAll("button[data-act]").forEach((btn) => {
                btn.addEventListener("click", async () => {
                  const email = btn.getAttribute("data-email");
                  const act = btn.getAttribute("data-act");
                  if (!email || !act || btn.disabled) return;
                  btn.disabled = true;
                  try {

                  if (act === "resolveAdjust") resolveAdjustment(email);
                  if (act === "mint") await mintCode(email);
                  if (act === "saveNote") await saveNote(email);

                  if (act === "addDays") {
                    const input = btn.closest(".rowbtn").querySelector("[data-pro-days]");
                    if (!input.reportValidity()) return;
                    await adjustDays(email, input.valueAsNumber);
                  }

                  if (act === "adjust") {
                    const delta = parseInt(btn.getAttribute("data-delta"), 10);
                    await adjustDays(email, delta);
                  }

                  if (act === "disable") {
                    const ok = confirm("Disabilitare l'utente " + email + "? (non potra piu loggarsi)");
                    if (!ok) return;
                    await disableUser(email, true);
                  }
                  } catch { alert("Operazione non confermata. Ricarica gli utenti per verificarne l’esito."); }
                  finally { btn.disabled = false; }
                });
              });
            }

            async function mintCode(email) {
              const { url, key } = getCfg();

              const res = await fetch(
                url + "/admin/mint?email=" + encodeURIComponent(email),
                {
                  method: "GET",
                  headers: { "x-admin-key": key },
                },
              );

              const j = await res.json().catch(() => ({}));
              if (!res.ok || !j.ok || !j.code) {
                alert(
                  "Errore mint: " + (j.message || j.error || "HTTP " + res.status),
                );
                return;
              }

              const code = j.code;

              // prova a copiare negli appunti
              if (navigator.clipboard?.writeText) {
                try {
                  await navigator.clipboard.writeText(code);
                } catch {}
              }
              alert("Codice generato (copiato se possibile):\n\n" + code);
            }
            // Persist unresolved operations before sending. Never store the admin key.
            const adjustmentsInFlight = new Set();
            function adjustmentKey(url, email) {
              return "calcio-report:pending-adjust:" + JSON.stringify([url, email.toLowerCase()]);
            }
            async function adjustDays(email, deltaDays) {
              const { url: rawUrl, key } = getCfg();
              const url = rawUrl.replace(/\/+$/, "");
              const storageKey = adjustmentKey(url, email);
              if (adjustmentsInFlight.has(storageKey)) return;
              let pending;
              try { pending = JSON.parse(localStorage.getItem(storageKey) || "null"); }
              catch { alert("Archivio locale non disponibile: rettifica non inviata."); return; }
              if (pending) {
                alert("Rettifica con esito da verificare: " + pending.requestId +
                  "\nNon viene reinviata: il Worker attuale potrebbe non gestire i retry. " +
                  "Verifica l'operazione prima di sbloccare una nuova rettifica.");
                return;
              }
              if (!confirm(`Confermi ${deltaDays > 0 ? "+" : ""}${deltaDays} giorni PRO per:\n${email}?`)) return;
              const operation = { requestId: crypto.randomUUID(), deltaDays, createdAt: Date.now() };
              try { localStorage.setItem(storageKey, JSON.stringify(operation)); }
              catch { alert("Impossibile salvare l'operazione: rettifica non inviata."); return; }
              adjustmentsInFlight.add(storageKey);
              try {
                const res = await fetch(url + "/admin/adjust", {
                  method: "POST",
                  headers: { "Content-Type": "application/json", "x-admin-key": key },
                  body: JSON.stringify({ email, deltaDays, requestId: operation.requestId }),
                });
                const j = await res.json();
                if (!res.ok || !j.ok) throw Error(j.message || j.error || "HTTP " + res.status);
                localStorage.removeItem(storageKey);
              } catch (e) {
                alert("Rettifica non confermata: " + String(e.message || e) +
                  "\nID: " + operation.requestId +
                  "\nNon ripetere l'accredito. Il blocco resta anche riaprendo questo file nello stesso browser.");
                return;
              } finally { adjustmentsInFlight.delete(storageKey); }
              await loadUsers();
            }
            function resolveAdjustment(email) {
              const { url } = getCfg();
              const storageKey = adjustmentKey(url.replace(/\/+$/, ""), email);
              if (adjustmentsInFlight.has(storageKey)) return;
              const pending = localStorage.getItem(storageKey);
              if (!pending) { alert("Nessuna rettifica sospesa."); return; }
              if (confirm("Hai verificato sul server se questa rettifica è stata applicata?\n" +
                pending + "\nSblocca solo dopo aver accertato l'esito: il prossimo clic sarà una NUOVA operazione.")) {
                localStorage.removeItem(storageKey);
              }
            }

            async function disableUser(email, disabled) {
              const { url, key } = getCfg();

              const res = await fetch(url + "/admin/disable", {
                method: "POST",
                headers: { "content-type": "application/json", "x-admin-key": key },
                body: JSON.stringify({ email, disabled: !!disabled }),
              });

              const j = await res.json().catch(() => ({}));
              if (!res.ok || !j.ok) {
                alert("Errore disable: " + (j.message || j.error || res.status));
                return;
              }

              // The legacy endpoint can return ok even for an unknown email.
              await loadUsers();
              if (!disabled) {
                const found = __USERS__.some(u => String(u.email || "").toLowerCase() === email.toLowerCase());
                alert(found ? "Accesso riabilitato per " + email : "Riabilitazione non verificata: l’email non compare tra gli utenti attivi. Controlla l’indirizzo e ricarica.");
              }
            }


            async function saveNote(email) {
              const { url, key } = getCfg();
              const ta = document.querySelector(
                `textarea[data-note-email="${CSS.escape(email)}"]`,
              );
              const note = ta ? ta.value : "";

              const res = await fetch(url + "/admin/note", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "x-admin-key": key,
                },
                body: JSON.stringify({ email, note }),
              });

              const j = await res.json().catch(() => ({}));
              if (!res.ok || !j.ok) {
                alert(
                  "Errore nota: " + (j.message || j.error || "HTTP " + res.status),
                );
                return;
              }
              alert("Nota salvata ✅");
              await loadUsers();
            }

            document.getElementById("btnLock").addEventListener("click", () => {
              document.getElementById("adminKey").value = "";
              __USERS__ = [];
              document.getElementById("output").textContent = "";
              document.getElementById("dashboard").textContent = "";
              location.reload();
            });
            document.getElementById("btnReenable").addEventListener("click", async () => {
              const input = document.getElementById("reenableEmail");
              const email = input.value.trim().toLowerCase();
              if (!email || !input.checkValidity()) { input.reportValidity(); return; }
              if (!getCfg().key) { alert("Inserisci la chiave amministratore."); return; }
              const btn = document.getElementById("btnReenable");
              if (btn.disabled || !confirm("Riabilitare l’accesso per " + email + "?")) return;
              btn.disabled = true;
              try { await disableUser(email, false); }
              catch { alert("Operazione non confermata. Ricarica gli utenti e controlla l’email prima di riprovare."); }
              finally { btn.disabled = false; }
            });
            document.getElementById("btnLoad").addEventListener("click", loadUsers);

            document
              .getElementById("searchEmail")
              .addEventListener("input", () => renderUsers(__USERS__));
            document
              .getElementById("filterStatus")
              .addEventListener("change", () => renderUsers(__USERS__));
    </script>
  </body>
</html>
